<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHRN Rolling Challenge</title>
<!--
  Rolling challenge display for the optical witness (CAMERA-PHOTO/v2).

  Open this file in any phone browser (works fully offline — SHA-256 is
  implemented below in plain JS, no network, no Web Crypto dependency).
  Type in the 16-hex session code issued at observation time. The screen then
  shows a large code that CHANGES every slot (default 10 s):

      code(slot) = first 12 hex of SHA-256("CHRN-ROLL/v1:" + CODE + ":" + slot)
      slot       = floor(unix_time / slot_seconds)

  Photographing this screen beside the sky target across two or more slots
  binds the frames to a TIME-VARYING value derived from the session challenge:
  a forger must fabricate a consistent code SEQUENCE matching the EXIF
  timeline, not copy one static handwritten string. Verification of what is
  visible in a frame remains a human step (stated in the protocol docs); the
  expected codes are recomputed by scripts/rolling_code.py.

  The phone's clock matters only to +/-1 slot; the verifier tolerates that.
-->
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#000; color:#eee; font-family: system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; gap:4vh; }
  #setup { display:flex; flex-direction:column; gap:12px; padding:24px; max-width:420px; }
  input { font-size:20px; font-family:monospace; padding:12px; background:#111;
          color:#eee; border:1px solid #444; border-radius:8px; text-transform:uppercase; }
  button { font-size:18px; padding:12px; border-radius:8px; border:none;
           background:#2563eb; color:#fff; }
  #code { font-family:"Consolas","Courier New",monospace; font-weight:bold;
          font-size:13vw; letter-spacing:0.06em; text-align:center; word-break:break-all; }
  #meta { font-family:monospace; font-size:4vw; color:#888; text-align:center; }
  #bar { width:80vw; height:6px; background:#222; border-radius:3px; overflow:hidden; }
  #fill { height:100%; background:#2563eb; width:0%; }
  .hidden { display:none; }
  small { color:#777; line-height:1.4; }
</style>
</head>
<body>
<div id="setup">
  <b>CHRN rolling challenge</b>
  <small>Enter the 16-character session code exactly as issued. Keep this screen
  at full brightness in the camera frame beside the sky target. Take shots at
  least 15 seconds apart so at least two different codes are captured.</small>
  <input id="seed" maxlength="16" placeholder="16-hex session code" autocomplete="off">
  <input id="slotsec" type="number" value="10" min="5" max="60" title="slot seconds">
  <button onclick="start()">Start</button>
</div>
<div id="run" class="hidden">
  <div id="code">------------</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="meta"></div>
</div>
<script>
"use strict";
/* ---- minimal SHA-256, public-domain style implementation ---- */
function sha256hex(msg){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const enc=new TextEncoder().encode(msg);
  const l=enc.length, bitLen=l*8;
  const padded=new Uint8Array(((l+8)>>6<<6)+64);
  padded.set(enc); padded[l]=0x80;
  const dv=new DataView(padded.buffer);
  dv.setUint32(padded.length-4, bitLen>>>0);
  dv.setUint32(padded.length-8, Math.floor(bitLen/0x100000000));
  const w=new Int32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<padded.length;i+=64){
    for(let t=0;t<16;t++) w[t]=dv.getInt32(i+t*4);
    for(let t=16;t<64;t++){
      const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K[t]+w[t])|0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}
/* ---- rolling display ---- */
let seed="", slotSec=10, timer=null;
function codeFor(slot){ return sha256hex("CHRN-ROLL/v1:"+seed+":"+slot).slice(0,12).toUpperCase(); }
function tick(){
  const now=Date.now()/1000;
  const slot=Math.floor(now/slotSec);
  document.getElementById("code").textContent=codeFor(slot);
  document.getElementById("meta").textContent="slot "+slot+"  ·  "+slotSec+"s  ·  "
    +new Date().toISOString().slice(11,19)+"Z";
  document.getElementById("fill").style.width=(100*(now/slotSec-slot))+"%";
}
function start(){
  seed=document.getElementById("seed").value.trim().toUpperCase();
  slotSec=parseInt(document.getElementById("slotsec").value)||10;
  if(!/^[0-9A-F]{16}$/.test(seed)){ alert("code must be exactly 16 hex characters"); return; }
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("run").classList.remove("hidden");
  if(screen.orientation&&screen.orientation.lock) screen.orientation.lock("portrait").catch(()=>{});
  tick(); timer=setInterval(tick,200);
}
</script>
</body>
</html>
